<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onelab Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fintech: {
                            50: '#f5f7fa',
                            100: '#e4e7eb',
                            500: '#3b82f6',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-fintech-50 text-gray-800 font-sans flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-fintech-100 flex flex-col flex-shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10">
        <!-- Logo -->
        <div class="px-6 py-5 border-b border-fintech-100 flex items-center h-[73px]">
            <h1 class="text-2xl font-bold text-fintech-900 tracking-tight">OneLab</h1>
        </div>
        
        <!-- Sidebar Content -->
        <div class="p-6 flex-1 overflow-y-auto">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Data Sources</h2>
            <form id="upload-form" class="flex flex-col space-y-5">
                <div class="flex flex-col">
                    <label class="text-sm text-gray-700 font-medium mb-1.5">Platform Transactions</label>
                    <input type="file" id="file-tx" accept=".csv" required class="text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-fintech-50 file:text-fintech-900 hover:file:bg-fintech-100 cursor-pointer w-full border border-gray-200 rounded p-1 transition">
                </div>
                <div class="flex flex-col">
                    <label class="text-sm text-gray-700 font-medium mb-1.5">Bank Settlements</label>
                    <input type="file" id="file-set" accept=".csv" required class="text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-fintech-50 file:text-fintech-900 hover:file:bg-fintech-100 cursor-pointer w-full border border-gray-200 rounded p-1 transition">
                </div>
                <button type="submit" class="w-full py-2 bg-fintech-500 text-white rounded-md text-sm font-medium hover:bg-blue-600 transition shadow-sm mt-2 flex justify-center items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    <span>Upload CSVs</span>
                </button>
            </form>
            
            <hr class="my-6 border-gray-100">
            
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Testing</h2>
            <button id="btn-generate" class="w-full px-4 py-2 bg-fintech-100 text-fintech-900 rounded-md hover:bg-gray-200 transition font-medium text-sm flex justify-center items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                <span>Generate Synthetic Data</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Top Navbar -->
        <nav class="bg-white border-b border-fintech-100 px-8 py-4 flex justify-between items-center shadow-sm h-[73px]">
            <div class="flex items-center text-sm font-medium text-gray-500">
                Dashboard / Reconciliation
            </div>
            <div class="flex space-x-4">
                <button id="btn-reconcile" class="px-6 py-2 bg-fintech-500 text-white rounded-md hover:bg-blue-600 transition font-medium text-sm shadow-sm flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <span>Run Reconciliation</span>
                </button>
            </div>
        </nav>
        
        <!-- Dashboard Body -->
        <main class="flex-1 overflow-y-auto px-8 py-8 bg-fintech-50">
            <div class="max-w-7xl mx-auto">
                <!-- Error/Success Banner -->
                <div id="alert-container" class="hidden mb-6 p-4 rounded-md shadow-sm"></div>

                <!-- Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-fintech-100 card-hover">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Transactions</p>
                        <p class="text-3xl font-bold text-gray-900 mt-2" id="val-transactions">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-fintech-100 card-hover">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Settlements</p>
                        <p class="text-3xl font-bold text-gray-900 mt-2" id="val-settlements">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-fintech-100 card-hover">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Mismatch Amount</p>
                        <p class="text-3xl font-bold text-red-500 mt-2" id="val-mismatch">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-fintech-100 card-hover">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Detected Issues</p>
                        <p class="text-3xl font-bold text-yellow-600 mt-2" id="val-issues">--</p>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 hidden" id="charts-section">
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-fintech-100">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">Volume Comparison</h3>
                        <div class="relative h-64">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-fintech-100">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">Issue Breakdown</h3>
                        <div class="relative h-64 flex justify-center">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-fintech-100">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">Mismatch Value</h3>
                        <div class="relative h-64">
                            <canvas id="mismatchChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Issues Table -->
                <div class="bg-white rounded-xl shadow-sm border border-fintech-100 overflow-hidden hidden" id="table-section">
                    <div class="px-6 py-4 border-b border-fintech-100 flex justify-between items-center">
                        <h3 class="text-lg font-semibold text-gray-800">Reconciliation Issues</h3>
                        <button id="btn-download" class="text-sm text-fintech-500 hover:text-fintech-900 font-medium flex items-center space-x-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                            <span>Download Report</span>
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                                    <th class="px-6 py-3 font-medium">Txn ID</th>
                                    <th class="px-6 py-3 font-medium">Issue Type</th>
                                    <th class="px-6 py-3 font-medium">Platform Amt</th>
                                    <th class="px-6 py-3 font-medium">Bank Amt</th>
                                    <th class="px-6 py-3 font-medium">AI Explanation</th>
                                </tr>
                            </thead>
                            <tbody id="issues-tbody" class="text-sm divide-y divide-gray-100">
                                <!-- Rows injected via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loader" class="hidden flex justify-center items-center py-20">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-fintech-500"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom JS -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
